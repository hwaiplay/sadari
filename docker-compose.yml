services:
  app:
    image: ${APP_IMAGE:-sadari-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sadari-app
    restart: unless-stopped
    env_file:
      - .env
      - ./secrets/app.env
      - ./secrets/infra.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # Firebase 서비스 계정 원문은 이미지에 포함하지 않고 배포 디렉터리의 읽기 전용 파일로 주입함
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      # Mac mini의 영구 업로드 폴더를 컨테이너 공통 경로에 연결
      - ${STORAGE_HOST_ROOT:-./uploads}:/app/uploads
    networks:
      - sadari-infra
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  sadari-infra:
    external: true
    name: ${INFRA_NETWORK:-sadari-mac-infra_default}

name: Sadari CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# 같은 브랜치의 이전 실행이 남아 있으면 취소해 오래된 이미지가 나중에 배포되는 경쟁 상태를 막음
concurrency:
  group: sadari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Verify application build
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootWar \
            -PfrontendInstallCommand=ci \
            --no-daemon \
            -x test

      # 현재 contextLoads 테스트는 Git에서 제외된 application-loc.yml과 로컬 DB/Redis를 요구함
      # CI용 독립 테스트 프로필이 생기기 전까지 패키징 검증을 수행하고, Docker 빌드에서도 동일 소스를 다시 검증함

  publish:
    name: Build and publish image
    if: github.event_name != 'pull_request'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Mac mini
    environment: mac-production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs:
      - publish
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - sadari-prod
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/Users/myhomeserver/sadari' }}
      DOCKER_BIN: /Applications/Docker.app/Contents/Resources/bin/docker
      PATH: /Applications/Docker.app/Contents/Resources/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      INFRA_NETWORK: ${{ vars.INFRA_NETWORK || 'sadari-mac-infra_default' }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_PORT: ${{ vars.APP_PORT || '8080' }}
      DB_CONNECTION_TIMEOUT: ${{ vars.DB_CONNECTION_TIMEOUT || '60000' }}
      DB_MAXIMUM_POOL_SIZE: ${{ vars.DB_MAXIMUM_POOL_SIZE || '10' }}
      DB_MINIMUM_IDLE: ${{ vars.DB_MINIMUM_IDLE || '2' }}
      HTTP_CONNECT_TIMEOUT_MILLIS: ${{ vars.HTTP_CONNECT_TIMEOUT_MILLIS || '3000' }}
      HTTP_READ_TIMEOUT_MILLIS: ${{ vars.HTTP_READ_TIMEOUT_MILLIS || '5000' }}
      JWT_ACCESS_TOKEN_SECONDS: ${{ vars.JWT_ACCESS_TOKEN_SECONDS || '1800' }}
      JWT_REFRESH_TOKEN_SECONDS: ${{ vars.JWT_REFRESH_TOKEN_SECONDS || '86400' }}
      JWT_REFRESH_ROTATION_GRACE_SECONDS: ${{ vars.JWT_REFRESH_ROTATION_GRACE_SECONDS || '10' }}
      WITHDRAWAL_HARD_DELETE_WAIT_DAYS: ${{ vars.WITHDRAWAL_HARD_DELETE_WAIT_DAYS || '30' }}
      TIMER_ATTENDANCE_MIN_SECONDS: ${{ vars.TIMER_ATTENDANCE_MIN_SECONDS || '600' }}
      TIMER_MAX_SESSION_SECONDS: ${{ vars.TIMER_MAX_SESSION_SECONDS || '28800' }}
      TIMER_ZONE_ID: ${{ vars.TIMER_ZONE_ID || 'Asia/Seoul' }}
      TIMER_DETAIL_RETENTION_DAYS: ${{ vars.TIMER_DETAIL_RETENTION_DAYS || '365' }}
      BOOK_SEARCH_CACHE_HIT_RATE_LIMIT_PER_MINUTE: ${{ vars.BOOK_SEARCH_CACHE_HIT_RATE_LIMIT_PER_MINUTE || '300' }}
      BOOK_SEARCH_CACHE_MISS_RATE_LIMIT_PER_MINUTE: ${{ vars.BOOK_SEARCH_CACHE_MISS_RATE_LIMIT_PER_MINUTE || '60' }}
      BOOK_SEARCH_RATE_LIMIT_PER_DAY: ${{ vars.BOOK_SEARCH_RATE_LIMIT_PER_DAY || '200' }}
      BOOK_SEARCH_PROVIDER_CALL_LIMIT_PER_DAY: ${{ vars.BOOK_SEARCH_PROVIDER_CALL_LIMIT_PER_DAY || '27000' }}
      BOOK_SEARCH_CACHE_TTL_SECONDS: ${{ vars.BOOK_SEARCH_CACHE_TTL_SECONDS || '600' }}
      BOOK_SEARCH_POPULAR_KEYWORD_WINDOW_DAYS: ${{ vars.BOOK_SEARCH_POPULAR_KEYWORD_WINDOW_DAYS || '7' }}
      BOOK_SEARCH_POPULAR_KEYWORD_MIN_USER_COUNT: ${{ vars.BOOK_SEARCH_POPULAR_KEYWORD_MIN_USER_COUNT || '3' }}
      BOOK_SEARCH_POPULAR_KEYWORD_MAX_SIZE: ${{ vars.BOOK_SEARCH_POPULAR_KEYWORD_MAX_SIZE || '10' }}
      MULTIPART_MAX_FILE_SIZE: ${{ vars.MULTIPART_MAX_FILE_SIZE || '20MB' }}
      MULTIPART_MAX_REQUEST_SIZE: ${{ vars.MULTIPART_MAX_REQUEST_SIZE || '40MB' }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'true' }}
      COOKIE_SAME_SITE: ${{ vars.COOKIE_SAME_SITE || 'Lax' }}
      LOGGING_LEVEL_ROOT: ${{ vars.LOGGING_LEVEL_ROOT || 'info' }}
      LOGGING_LEVEL_APP: ${{ vars.LOGGING_LEVEL_APP || 'info' }}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /app/uploads
      STORAGE_HOST_ROOT: ${{ vars.STORAGE_HOST_ROOT || './uploads' }}
      FRONT_DOMAIN: ${{ vars.FRONT_DOMAIN }}
      BACK_DOMAIN: ${{ vars.BACK_DOMAIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
      KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
      GOOGLE_TRANSLATION_API_KEY: ${{ secrets.GOOGLE_TRANSLATION_API_KEY }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
      FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
      FIREBASE_WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
      FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
      FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      FIREBASE_VAPID_PUBLIC_KEY: ${{ secrets.FIREBASE_VAPID_PUBLIC_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_ROOT" != /Users/*/sadari ]]; then
            echo "::error::DEPLOY_ROOT must end with /sadari under /Users."
            exit 1
          fi

          "$DOCKER_BIN" network inspect "$INFRA_NETWORK" > /dev/null
          test "$("$DOCKER_BIN" inspect --format '{{.State.Health.Status}}' sadari-mysql)" = "healthy"
          test "$("$DOCKER_BIN" inspect --format '{{.State.Running}}' sadari-redis)" = "true"
          test -f "$DEPLOY_ROOT/secrets/infra.env"

          required_values=(
            FRONT_DOMAIN BACK_DOMAIN JWT_SECRET KAKAO_REST_API_KEY KAKAO_JAVASCRIPT_KEY
            GOOGLE_BOOKS_API_KEY FIREBASE_WEB_API_KEY FIREBASE_WEB_AUTH_DOMAIN
            FIREBASE_WEB_PROJECT_ID FIREBASE_WEB_STORAGE_BUCKET
            FIREBASE_WEB_MESSAGING_SENDER_ID FIREBASE_WEB_APP_ID
            FIREBASE_VAPID_PUBLIC_KEY FIREBASE_SERVICE_ACCOUNT_JSON
          )
          for key in "${required_values[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is not configured in the mac-production environment."
              exit 1
            fi
          done

      - name: Create deployment bundle
        id: bundle
        shell: bash
        env:
          APP_IMAGE: ${{ needs.publish.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          bundle_dir="$(mktemp -d "$RUNNER_TEMP/sadari-deploy.XXXXXX")"

          # 값 안의 따옴표, 역슬래시, 개행을 Docker Compose env_file 문법에 맞게 이스케이프함
          write_env() {
            local key="$1"
            local value="$2"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            value="${value//$'\n'/\\n}"
            printf '%s="%s"\n' "$key" "$value" >> "$target_file"
          }

          target_file="$bundle_dir/.env"
          : > "$bundle_dir/.env"
          write_env APP_IMAGE "$APP_IMAGE"
          write_env APP_PORT "$APP_PORT"
          write_env INFRA_NETWORK "$INFRA_NETWORK"
          write_env DB_CONNECTION_TIMEOUT "$DB_CONNECTION_TIMEOUT"
          write_env DB_MAXIMUM_POOL_SIZE "$DB_MAXIMUM_POOL_SIZE"
          write_env DB_MINIMUM_IDLE "$DB_MINIMUM_IDLE"
          write_env HTTP_CONNECT_TIMEOUT_MILLIS "$HTTP_CONNECT_TIMEOUT_MILLIS"
          write_env HTTP_READ_TIMEOUT_MILLIS "$HTTP_READ_TIMEOUT_MILLIS"
          write_env JWT_ACCESS_TOKEN_SECONDS "$JWT_ACCESS_TOKEN_SECONDS"
          write_env JWT_REFRESH_TOKEN_SECONDS "$JWT_REFRESH_TOKEN_SECONDS"
          write_env JWT_REFRESH_ROTATION_GRACE_SECONDS "$JWT_REFRESH_ROTATION_GRACE_SECONDS"
          write_env WITHDRAWAL_HARD_DELETE_WAIT_DAYS "$WITHDRAWAL_HARD_DELETE_WAIT_DAYS"
          write_env TIMER_ATTENDANCE_MIN_SECONDS "$TIMER_ATTENDANCE_MIN_SECONDS"
          write_env TIMER_MAX_SESSION_SECONDS "$TIMER_MAX_SESSION_SECONDS"
          write_env TIMER_ZONE_ID "$TIMER_ZONE_ID"
          write_env TIMER_DETAIL_RETENTION_DAYS "$TIMER_DETAIL_RETENTION_DAYS"
          write_env BOOK_SEARCH_CACHE_HIT_RATE_LIMIT_PER_MINUTE "$BOOK_SEARCH_CACHE_HIT_RATE_LIMIT_PER_MINUTE"
          write_env BOOK_SEARCH_CACHE_MISS_RATE_LIMIT_PER_MINUTE "$BOOK_SEARCH_CACHE_MISS_RATE_LIMIT_PER_MINUTE"
          write_env BOOK_SEARCH_RATE_LIMIT_PER_DAY "$BOOK_SEARCH_RATE_LIMIT_PER_DAY"
          write_env BOOK_SEARCH_PROVIDER_CALL_LIMIT_PER_DAY "$BOOK_SEARCH_PROVIDER_CALL_LIMIT_PER_DAY"
          write_env BOOK_SEARCH_CACHE_TTL_SECONDS "$BOOK_SEARCH_CACHE_TTL_SECONDS"
          write_env BOOK_SEARCH_POPULAR_KEYWORD_WINDOW_DAYS "$BOOK_SEARCH_POPULAR_KEYWORD_WINDOW_DAYS"
          write_env BOOK_SEARCH_POPULAR_KEYWORD_MIN_USER_COUNT "$BOOK_SEARCH_POPULAR_KEYWORD_MIN_USER_COUNT"
          write_env BOOK_SEARCH_POPULAR_KEYWORD_MAX_SIZE "$BOOK_SEARCH_POPULAR_KEYWORD_MAX_SIZE"
          write_env MULTIPART_MAX_FILE_SIZE "$MULTIPART_MAX_FILE_SIZE"
          write_env MULTIPART_MAX_REQUEST_SIZE "$MULTIPART_MAX_REQUEST_SIZE"
          write_env COOKIE_SECURE "$COOKIE_SECURE"
          write_env COOKIE_SAME_SITE "$COOKIE_SAME_SITE"
          write_env SERVER_PORT "8080"
          write_env LOGGING_LEVEL_ROOT "$LOGGING_LEVEL_ROOT"
          write_env LOGGING_LEVEL_APP "$LOGGING_LEVEL_APP"
          write_env STORAGE_PROVIDER "$STORAGE_PROVIDER"
          write_env STORAGE_LOCAL_ROOT "$STORAGE_LOCAL_ROOT"
          write_env STORAGE_HOST_ROOT "$STORAGE_HOST_ROOT"

          target_file="$bundle_dir/app.env"
          : > "$bundle_dir/app.env"
          write_env FRONT_DOMAIN "$FRONT_DOMAIN"
          write_env BACK_DOMAIN "$BACK_DOMAIN"
          write_env JWT_SECRET "$JWT_SECRET"
          write_env KAKAO_REST_API_KEY "$KAKAO_REST_API_KEY"
          write_env KAKAO_JAVASCRIPT_KEY "$KAKAO_JAVASCRIPT_KEY"
          write_env KAKAO_NATIVE_APP_KEY "$KAKAO_NATIVE_APP_KEY"
          write_env GOOGLE_TRANSLATION_API_KEY "$GOOGLE_TRANSLATION_API_KEY"
          write_env GOOGLE_BOOKS_API_KEY "$GOOGLE_BOOKS_API_KEY"
          write_env FIREBASE_WEB_API_KEY "$FIREBASE_WEB_API_KEY"
          write_env FIREBASE_WEB_AUTH_DOMAIN "$FIREBASE_WEB_AUTH_DOMAIN"
          write_env FIREBASE_WEB_PROJECT_ID "$FIREBASE_WEB_PROJECT_ID"
          write_env FIREBASE_WEB_STORAGE_BUCKET "$FIREBASE_WEB_STORAGE_BUCKET"
          write_env FIREBASE_WEB_MESSAGING_SENDER_ID "$FIREBASE_WEB_MESSAGING_SENDER_ID"
          write_env FIREBASE_WEB_APP_ID "$FIREBASE_WEB_APP_ID"
          write_env FIREBASE_VAPID_PUBLIC_KEY "$FIREBASE_VAPID_PUBLIC_KEY"
          write_env FIREBASE_CREDENTIALS_PATH "file:/run/secrets/firebase-service-account.json"
          write_env STORAGE_S3_BUCKET ""
          write_env STORAGE_S3_REGION "ap-northeast-2"
          write_env STORAGE_S3_ENDPOINT ""
          write_env STORAGE_S3_PATH_STYLE_ACCESS "false"
          write_env AWS_ACCESS_KEY_ID ""
          write_env AWS_SECRET_ACCESS_KEY ""

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$bundle_dir/firebase-service-account.json"
          test -s "$bundle_dir/app.env"
          test -s "$bundle_dir/firebase-service-account.json"

          cp docker-compose.yml "$bundle_dir/docker-compose.yml"
          echo "path=$bundle_dir" >> "$GITHUB_OUTPUT"

      - name: Deploy containers
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail

          install -d -m 700 "$DEPLOY_ROOT" "$DEPLOY_ROOT/secrets" "$DEPLOY_ROOT/uploads"
          install -m 600 "$BUNDLE_DIR/.env" "$DEPLOY_ROOT/.env"
          install -m 600 "$BUNDLE_DIR/docker-compose.yml" "$DEPLOY_ROOT/docker-compose.yml"
          install -m 600 "$BUNDLE_DIR/app.env" "$DEPLOY_ROOT/secrets/app.env"
          install -m 600 "$BUNDLE_DIR/firebase-service-account.json" \
            "$DEPLOY_ROOT/secrets/firebase-service-account.json"

          if [[ "$BUNDLE_DIR" != "$RUNNER_TEMP"/sadari-deploy.* ]]; then
            echo "::error::Unexpected deployment bundle path."
            exit 1
          fi
          rm -rf "$BUNDLE_DIR"

          previous_image="$("$DOCKER_BIN" inspect --format '{{.Config.Image}}' sadari-app 2>/dev/null || true)"
          docker_config="$(mktemp -d "$RUNNER_TEMP/sadari-docker.XXXXXX")"
          export DOCKER_CONFIG="$docker_config"
          trap 'rm -rf "$docker_config"' EXIT
          registry_auth="$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$registry_auth" \
            > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"

          cd "$DEPLOY_ROOT"
          "$DOCKER_BIN" compose pull app
          "$DOCKER_BIN" compose up -d --remove-orphans

          # Spring Boot와 정적 프론트가 모두 올라오는 시간을 고려해 최대 2분 동안 실제 HTTP 응답을 확인함
          for attempt in {1..24}; do
            if curl --fail --location --silent --show-error \
              "http://127.0.0.1:${APP_PORT}/" > /dev/null; then
              echo "Sadari deployment is healthy."
              exit 0
            fi

            sleep 5
          done

          "$DOCKER_BIN" compose ps
          "$DOCKER_BIN" compose logs --tail=200 app

          # 새 이미지가 기동하지 못하면 직전 컨테이너 이미지로 복구함
          if [[ -n "$previous_image" ]]; then
            APP_IMAGE="$previous_image" "$DOCKER_BIN" compose up -d --no-deps app
          fi
          exit 1

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 운영 DB 장애 시 요청 스레드가 오래 묶이지 않도록 커넥션 획득 대기시간을 1분으로 제한한다.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:60000}
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${DB_MINIMUM_IDLE:2}
  application:
    name: sadari
  config:
    activate:
      on-profile: prod
  session:
    store-type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      # 서비스의 이미지 바이트 검증 전에 과도한 업로드 본문이 서버 자원을 점유하지 못하도록 파일당 크기를 제한한다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      # 프로필과 배경 이미지를 한 요청에 각각 10MB까지 전송할 수 있도록 multipart 부가 데이터를 포함한 여유를 둔다.
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:21MB}

mybatis:
  mapper-locations: classpath:org/our/sadari/**/**/*.xml
  type-aliases-package: org.our.sadari.**.**.vo
  configuration:
    map-underscore-to-camel-case: true

domain:
  front: ${FRONT_DOMAIN}
  back: ${BACK_DOMAIN}

kakao:
  redirect:
    uri: /api/oauth/callback/kakao
  key:
    restApi: ${KAKAO_REST_API_KEY}
    javaScript: ${KAKAO_JAVASCRIPT_KEY}
    nativeApp: ${KAKAO_NATIVE_APP_KEY:}

# 카카오 도서 검색 API 주소는 공급자 계약 변경 시 코드 재빌드 없이 설정 파일에서 교체할 수 있게 관리한다.
book:
  search:
    url: https://dapi.kakao.com/v3/search/book
    # 한 회원의 짧은 시간 반복 검색을 Redis에서 차단하는 60초 기준 요청 한도이다.
    rate-limit-per-minute: ${BOOK_SEARCH_RATE_LIMIT_PER_MINUTE:20}
    # 비활성화와 재로그인으로 초기화되지 않는 회원별 24시간 요청 한도이다.
    rate-limit-per-day: ${BOOK_SEARCH_RATE_LIMIT_PER_DAY:200}
    # 카카오의 3만 건 쿼터 중 3천 건을 비상 여유로 남기는 앱 전체 실제 호출 한도이다.
    provider-call-limit-per-day: ${BOOK_SEARCH_PROVIDER_CALL_LIMIT_PER_DAY:27000}
    # 사용자 식별값 없이 검색어 해시와 50권 페이지로 공유하는 Redis 캐시 유효시간이다.
    cache-ttl-seconds: ${BOOK_SEARCH_CACHE_TTL_SECONDS:600}

firebase:
  web:
    # 브라우저 Push 구독에 쓰는 VAPID public key이다. public key지만 환경별 교체를 위해 환경변수로 관리한다.
    api-key: ${FIREBASE_WEB_API_KEY}
    auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN}
    project-id: ${FIREBASE_WEB_PROJECT_ID}
    storage-bucket: ${FIREBASE_WEB_STORAGE_BUCKET}
    messaging-sender-id: ${FIREBASE_WEB_MESSAGING_SENDER_ID}
    app-id: ${FIREBASE_WEB_APP_ID}
    vapid-public-key: ${FIREBASE_VAPID_PUBLIC_KEY}
  admin:
    # FCM 서버 발송에 쓰는 service account json 경로이다. json 원문은 Git이 아니라 EC2/Docker secret/환경별 파일로 관리한다.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH}

jwt:
  secret_key: ${JWT_SECRET}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_SECONDS:1800}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_SECONDS:86400}
  refresh-rotation-grace-in-seconds: ${JWT_REFRESH_ROTATION_GRACE_SECONDS:10}

app:
  storage:
    # S3를 사용하지 않는 Windows 실행 환경은 사용자·관리자 앱이 같은 공유 디렉터리를 사용한다.
    provider: ${STORAGE_PROVIDER:s3}
    local-root: ${STORAGE_LOCAL_ROOT:C:/shared/sadari-uploads}
    s3:
      bucket: ${STORAGE_S3_BUCKET}
      region: ${STORAGE_S3_REGION:ap-northeast-2}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:false}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
  upload:
    # 운영 환경에서도 파일 검증 기준을 환경변수로 조정하되 기본값은 로컬과 동일하게 유지한다.
    max-image-bytes: ${UPLOAD_MAX_IMAGE_BYTES:10485760}
    max-image-pixels: ${UPLOAD_MAX_IMAGE_PIXELS:20000000}
    max-image-dimension: ${UPLOAD_MAX_IMAGE_DIMENSION:8192}
  cookie:
    # HTTPS 운영 환경에서는 true가 맞다. 로컬 테스트용 prod 실행이 필요하면 환경변수로 false를 줄 수 있다.
    secure: ${COOKIE_SECURE:true}
    # 프론트와 백엔드가 서로 다른 사이트면 None, 같은 사이트면 Lax를 사용한다.
    same-site: ${COOKIE_SAME_SITE:None}

# 운영 환경에서도 한 실행당 최대 100건을 넘길 수 없으며 시간대와 cron은 배포 환경변수로 조정할 수 있다.
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  max-size: ${SCHEDULER_MAX_SIZE:100}

# 독서 타이머는 서울 시간대 기준 하루 10분을 출석으로 인정하고 세션 상세를 1년 보존한다.
reading-timer:
  attendance-min-seconds: ${TIMER_ATTENDANCE_MIN_SECONDS:600}
  max-session-seconds: ${TIMER_MAX_SESSION_SECONDS:14400}
  zone-id: ${TIMER_ZONE_ID:Asia/Seoul}
  detail-retention-days: ${TIMER_DETAIL_RETENTION_DAYS:365}

# 운영 영구 탈퇴는 기본 30일 유예기간을 적용하고 로컬 전용 테스트 스케줄러는 항상 비활성화한다.
withdrawal:
  hard-delete-wait-days: ${WITHDRAWAL_HARD_DELETE_WAIT_DAYS:30}
  hard-delete-test-enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
    org.our.sadari: ${LOGGING_LEVEL_APP:info}
